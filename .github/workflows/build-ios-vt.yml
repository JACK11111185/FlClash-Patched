name: build-ios-vt-nosign

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Init submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Go core build check
        working-directory: core
        run: go build .

      - name: Flutter pub get
        run: flutter pub get

      - name: Build unsigned iOS IPA
        run: dart setup.dart ios --no-codesign -v

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: flclash-ios-vt-nosign
          path: ./dist/*.ipa
