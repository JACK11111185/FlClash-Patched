name: FlClash multi-platform build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios
          - desktop
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  FLUTTER_VERSION: '3.44.4'
  GO_VERSION: '1.25.x'
  NDK_VERSION: 'r27c'

jobs:
  verify:
    name: Verify Flutter and Go
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Go core
        working-directory: core
        run: |
          CGO_ENABLED=0 go test ./...
          CGO_ENABLED=0 go vet ./...

      - name: Verify Flutter application
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test --reporter expanded

  android:
    name: Android arm64
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'android'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore build tool permissions
        run: chmod +x plugins/setup/buildkit/run_build_tool.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          flutter pub get
          dart setup.dart android --arch arm64 -v
          test -n "$(find dist -type f -name '*.apk' -print -quit)"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-android-arm64
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows x64
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'desktop'
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build Windows archive
        shell: bash
        run: |
          flutter pub get
          dart setup.dart windows --targets zip -v
          test -n "$(find dist -type f -name '*.zip' -print -quit)"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'desktop'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore build tool permissions
        run: chmod +x plugins/setup/buildkit/run_build_tool.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build Linux packages
        run: |
          flutter pub get
          dart setup.dart linux -v
          test -n "$(find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pacman' -o -name '*.AppImage' -o -name '*.zip' \) -print -quit)"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-linux-x64
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'desktop'
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore build tool permissions
        run: chmod +x plugins/setup/buildkit/run_build_tool.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build macOS package
        run: |
          flutter pub get
          dart setup.dart macos -v
          test -n "$(find dist -type f -name '*.dmg' -print -quit)"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  ios:
    name: iOS arm64 unsigned
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'ios'
    needs: verify
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore build tool permissions
        run: chmod +x plugins/setup/buildkit/run_build_tool.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build unsigned IPA
        run: |
          flutter pub get
          dart setup.dart ios --no-codesign -v
          test -n "$(find dist -type f -name '*.ipa' -print -quit)"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-ios-arm64-unsigned
          path: dist/*.ipa
          if-no-files-found: error
